<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard – RecriarMentes</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>#app{display:none;min-height:100vh}.side{position:fixed;top:0;bottom:0;left:0;width:250px;padding:22px 16px;background:rgba(13,22,26,.85);backdrop-filter:blur(16px);border-right:1px solid var(--b);display:flex;flex-direction:column;gap:6px}
.side .logo{margin:0 8px 26px}.side a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;color:var(--m);cursor:pointer;font-size:14px;font-weight:500;transition:.2s}.side a:hover{background:rgba(255,255,255,.06);color:var(--t)}.side a.on{background:rgba(45,212,191,.12);color:var(--a)}
.me{margin-top:auto;padding:14px;border:1px solid var(--b);border-radius:14px;font-size:13px;background:var(--s)}.me small{color:var(--m);display:block;margin-bottom:10px;text-transform:uppercase;letter-spacing:1px;font-size:10px}
main{margin-left:250px;padding:34px 40px}main h2{margin:0 0 4px;font-size:28px;letter-spacing:-.8px}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:26px 0}.k .card{padding:22px}.k b{font-size:36px;font-weight:800;display:block;margin-top:6px}.k span{color:var(--m);font-size:13px}.k .ic{position:absolute;right:18px;top:18px;width:38px;height:38px;font-size:18px;margin:0}
.row{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-bottom:16px}.card h4{margin:0 0 16px;font-size:14px;color:var(--m);font-weight:600}.add{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end;margin-bottom:18px}.add input,.add select{margin:6px 0 0}
.line{stroke-dasharray:1200;stroke-dashoffset:1200;animation:dr 2s forwards}@keyframes dr{to{stroke-dashoffset:0}}.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.07);margin:6px 0 16px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width 1.3s}
#login{min-height:100vh;display:grid;place-items:center}#login .card{width:380px}
@media(max-width:900px){.side{display:none}main{margin:0;padding:20px}.row{grid-template-columns:1fr}}</style><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet"></head><body>
<div class="orb o1"></div><div class="orb o2"></div>
<div id="login"><div class="card"><div class="logo" style="margin-bottom:24px"><svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset=".6" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="11" fill="url(#lg)"/><path d="M14 28V12h7.5a5 5 0 010 10H14m8 0l5 6" stroke="#04201c" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="ob"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-dasharray="2 5"/><circle cx="20" cy="1.5" r="2.2" fill="#fff"/></g></svg><div>RecriarMentes<small>Dashboard</small></div></div><label>E-mail</label><input id="le"><label>Senha</label><input type="password" id="ls" onkeydown="event.key=='Enter'&&entrar()"><button class="btn" style="width:100%;padding:14px" onclick="entrar()">Acessar painel</button><p class="msg" id="lr"></p></div></div>
<div id="app"><aside class="side"><div class="logo"><svg viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2dd4bf"/><stop offset=".6" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="11" fill="url(#lg)"/><path d="M14 28V12h7.5a5 5 0 010 10H14m8 0l5 6" stroke="#04201c" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><g class="ob"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-dasharray="2 5"/><circle cx="20" cy="1.5" r="2.2" fill="#fff"/></g></svg><div>RecriarMentes<small>Dashboard</small></div></div><div id="tabs"></div><div class="me"><small>Conectado</small><b id="who"></b><br><span id="pf" class="tag" style="display:inline-block;margin:8px 0 12px"></span><br><button class="btn o" style="width:100%;padding:8px" onclick="sair()">Sair</button></div></aside><main><div id="view"></div></main></div>
<script>
const $=i=>document.getElementById(i),j=(u,m='GET',b)=>fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b&&JSON.stringify(b)}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.erro);return d});
const T=[['home','monitoring','Visão geral','agenda'],['agenda','calendar_month','Agendamentos','agenda'],['clientes','groups','Clientes','clientes'],['prof','medical_services','Profissionais','prof'],['horarios','schedule','Horários','horarios'],['msgs','mail','Mensagens','msgs'],['usr','manage_accounts','Usuários do Dash','*']];
const safeHtml=Symbol('safeHtml'),markup=value=>({[safeHtml]:true,value});
const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const tb=(h,r)=>`<div class="card" style="padding:8px 14px;overflow:auto"><table><tr>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(c=>`<td>${c?.[safeHtml]?c.value:esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td>Nenhum registro</td></tr>'}</table></div>`;
const tg=s=>`<span class="tag ${['confirmado','pendente','cancelado'].includes(s)?s:''}">${esc(s)}</span>`,H=(t,s)=>`<h2>${esc(t)}</h2><span style="color:var(--m)">${esc(s)}</span>`;
async function entrar(){try{await j('/api/admin/login','POST',{email:$('le').value,senha:$('ls').value});init()}catch(e){$('lr').textContent=e.message}}
async function sair(){await j('/api/admin/logout','POST');location.reload()}
let me,cur;
async function init(){try{me=await j('/api/admin/me')}catch{return}$('login').style.display='none';$('app').style.display='block';$('who').textContent=me.nome;$('pf').textContent=me.perfil;
 $('tabs').innerHTML=T.filter(t=>me.perms.includes('*')||me.perms.includes(t[3])).map(t=>`<a id="t_${t[0]}" onclick="go('${t[0]}')"><span class="material-symbols-rounded" aria-hidden="true">${t[1]}</span>${t[2]}</a>`).join('');go(me.perms.includes('agenda')?'home':'msgs')}
async function go(k){cur=k;document.querySelectorAll('.side a').forEach(a=>a.classList.toggle('on',a.id=='t_'+k));$('view').innerHTML=await V[k]();if(k=='home')anim()}
function cnt(){document.querySelectorAll('[data-n]').forEach(c=>{const t=+c.dataset.n;let i=0;const k=setInterval(()=>{i+=Math.max(1,Math.ceil(t/30));if(i>=t){i=t;clearInterval(k)}c.textContent=i},35)})}
function anim(){cnt();setTimeout(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'),100)}
function lineChart(d){const days=[...Array(14)].map((_,i)=>{const x=new Date();x.setDate(x.getDate()-6+i);return x.toISOString().slice(0,10)}),v=days.map(x=>(d.find(r=>r.d==x)||{n:0}).n),mx=Math.max(3,...v),W=620,Hh=200,P=24,px=i=>P+i*(W-2*P)/13,py=n=>Hh-P-(n/mx)*(Hh-2*P-10),pts=v.map((n,i)=>[px(i),py(n)]),path=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
 return `<svg viewBox="0 0 ${W} ${Hh+14}" style="width:100%"><defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2dd4bf" stop-opacity=".35"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="${P}" x2="${W-P}" y1="${P+i*(Hh-2*P)/3}" y2="${P+i*(Hh-2*P)/3}" stroke="#fff" stroke-opacity=".06"/>`).join('')}<path d="${path} L${px(13)} ${Hh-P} L${px(0)} ${Hh-P}Z" fill="url(#ar)"/><path class="line" d="${path}" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${days[i]==new Date().toISOString().slice(0,10)?6:3.5}" fill="#060b0e" stroke="#38bdf8" stroke-width="2"><title>${days[i]}: ${v[i]}</title></circle>`).join('')}${days.map((x,i)=>i%2?'':`<text x="${px(i)}" y="${Hh+8}" fill="#8aa0a7" font-size="10" text-anchor="middle">${x.slice(8)}/${x.slice(5,7)}</text>`).join('')}</svg>`}
function donut(a){const C={confirmado:'#2dd4bf',pendente:'#fbbf24',cancelado:'#fb7185'},t=a.reduce((s,x)=>s+x.n,0)||1;let o=0;return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><svg viewBox="0 0 42 42" width="150" style="transform:rotate(-90deg)"><circle cx="21" cy="21" r="15.9" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="5"/>${a.map(x=>{const p=x.n/t*100,e=`<circle cx="21" cy="21" r="15.9" fill="none" stroke="${C[x.s]||'#a78bfa'}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${-o}"/>`;o+=p;return e}).join('')}</svg><div>${a.map(x=>`<div style="font-size:13px;margin:6px 0"><span style="color:${C[x.s]||'#a78bfa'}">●</span> ${esc(x.s)} <b>${x.n}</b></div>`).join('')||'<span style="color:var(--m)">Sem dados</span>'}</div></div>`}
const V={
async home(){const[s,c]=await Promise.all([j('/api/admin/stats'),j('/api/admin/charts')]),mx=Math.max(1,...c.prof.map(p=>p.c)),on=c.total?Math.round(c.online/c.total*100):0;
 return H('Visão geral',`Olá, ${me.nome} — resumo da clínica`)+`<div class="k"><div class="card"><div class="ic"><span class="material-symbols-rounded" aria-hidden="true">groups</span></div><span>Clientes</span><b data-n="${Number(s.clientes)}">0</b></div><div class="card"><div class="ic"><span class="material-symbols-rounded" aria-hidden="true">calendar_month</span></div><span>Consultas hoje</span><b data-n="${Number(s.hoje)}">0</b></div><div class="card"><div class="ic"><span class="material-symbols-rounded" aria-hidden="true">hourglass_top</span></div><span>Pendentes</span><b data-n="${Number(s.pend)}">0</b></div><div class="card"><div class="ic"><span class="material-symbols-rounded" aria-hidden="true">monitoring</span></div><span>Total de agendamentos</span><b data-n="${Number(c.total)}">0</b></div></div>
 <div class="row"><div class="card"><h4>Agendamentos · últimos 7 e próximos 7 dias</h4>${lineChart(c.dia)}</div><div class="card"><h4>Status</h4>${donut(c.status)}<h4 style="margin-top:24px">Online vs presencial · ${on}% online</h4><div class="bar"><i data-w="${on}" style="width:0"></i></div></div></div>
 <div class="row" style="grid-template-columns:1fr 1.4fr"><div class="card"><h4>Por profissional</h4>${c.prof.map(p=>`<div style="font-size:13px;display:flex;justify-content:space-between"><span>${esc(p.n)}</span><b>${p.c}</b></div><div class="bar"><i data-w="${p.c/mx*100}" style="width:0"></i></div>`).join('')||'<span style="color:var(--m)">Cadastre profissionais</span>'}</div>
 <div class="card"><h4>Próximas consultas</h4><table>${c.prox.map(a=>`<tr><td>${esc(a.data.slice(8))}/${esc(a.data.slice(5,7))} ${esc(a.hora)}</td><td>${esc(a.cliente)}</td><td>${esc(a.prof)}</td><td>${tg(a.status)}</td></tr>`).join('')||'<tr><td style="color:var(--m)">Nada agendado</td></tr>'}</table></div></div>`},
async agenda(){const d=await j('/api/admin/agenda');return H('Agendamentos','Confirme ou cancele consultas')+'<br><br>'+tb(['Data','Hora','Cliente','Telefone','Profissional','Modal.','Status',''],d.map(a=>[a.data,a.hora,a.cliente,a.telefone,a.prof,a.modalidade,markup(tg(a.status)),markup(`<a href="#" onclick="st(${Number(a.id)},'confirmado');return false">Confirmar</a> · <a href="#" onclick="st(${Number(a.id)},'cancelado');return false" style="color:#fb7185">Cancelar</a>`)]))},
async clientes(){const d=await j('/api/admin/clientes');return H('Clientes',d.length+' cadastrados')+'<br><br>'+tb(['Nome','E-mail','Telefone','Desde',''],d.map(c=>[c.nome,c.email,c.telefone,c.criado,markup(`<a href="#" style="color:#fb7185" onclick="del('clientes',${Number(c.id)});return false">Excluir</a>`)]))},
async prof(){const d=await j('/api/admin/prof');return H('Profissionais','Equipe que aparece no agendamento')+`<br><br><div class="card add"><div><label>Nome</label><input id="pn"></div><div><label>Especialidade</label><input id="pe"></div><button class="btn" onclick="add('prof',{nome:pn.value,especialidade:pe.value})">+ Cadastrar</button></div>`+tb(['Nome','Especialidade','Status'],d.map(p=>[p.nome,p.especialidade,markup(`<a href="#" onclick="tog(${Number(p.id)},${p.ativo?0:1});return false">${p.ativo?'● Ativo (desativar)':'○ Inativo (ativar)'}</a>`)]))},
async horarios(){const d=await j('/api/admin/horarios');return H('Horários','Horários disponíveis para agendamento')+`<br><br><div class="card add"><div><label>Novo horário</label><input type="time" id="hh"></div><button class="btn" onclick="add('horarios',{hora:hh.value})">+ Adicionar</button></div>`+tb(['Hora',''],d.map(h=>[h.hora,markup(`<a href="#" style="color:#fb7185" onclick="del('horarios',${Number(h.id)});return false">Remover</a>`)]))},
async msgs(){const d=await j('/api/admin/msgs');return H('Mensagens','Contatos recebidos pelo site')+'<br><br>'+tb(['Data','Nome','E-mail','Telefone','Mensagem'],d.map(m=>[m.criado,m.nome,m.email,m.telefone,m.texto]))},
async usr(){const d=await j('/api/admin/usuarios');return H('Usuários do Dash','Somente admin cria acessos')+`<br><br><div class="card add"><div><label>Nome</label><input id="un"></div><div><label>E-mail</label><input id="ue"></div><div><label>Senha</label><input id="us" type="password"></div><div><label>Perfil</label><select id="up"><option value="atendente">Atendente</option><option value="gerente">Gerente</option><option value="admin">Admin</option></select></div><button class="btn" onclick="add('usuarios',{nome:un.value,email:ue.value,senha:us.value,perfil:up.value})">+ Criar</button></div>`+tb(['Nome','E-mail','Perfil',''],d.map(u=>[u.nome,u.email,markup(`<span class="tag">${esc(u.perfil)}</span>`),markup(`<a href="#" style="color:#fb7185" onclick="del('usuarios',${Number(u.id)});return false">Excluir</a>`)]))}};
const st=(id,v)=>j('/api/admin/agenda/'+id,'PATCH',{status:v}).then(()=>go('agenda')),err=e=>alert(e.message);
const add=(p,b)=>j('/api/admin/'+p,'POST',b).then(()=>go(cur)).catch(err),del=(p,id)=>confirm('Confirmar?')&&j(`/api/admin/${p=='usuarios'?'usuarios':p}/${id}`,'DELETE').then(()=>go(cur)).catch(err),tog=(id,a)=>j('/api/admin/prof/'+id,'PATCH',{ativo:a}).then(()=>go('prof'));
init();
</script></body></html>
